# 匀速到达：每 50 毫秒一个请求。
name: uniform_500
seed: 23
num_tasks: 500
batch_interval: 0.1
max_concurrency: 32

steps:
  min: 1
  max: 1

arrival:
  pattern: uniform
  rate_per_sec: 20.0
  jitter: 0.5

prompt:
  tokens_min: 50
  tokens_max: 600

output:
  median_tokens: 60
  sigma: 0.7

max_tokens: 256

model:
  base_ms: 20.0
  prefill_ms_per_token: 0.02
  decode_ms_per_token: 5.0
  jitter_sigma: 0.1

faults:
  error_rate: 0.0
  timeout_rate: 0.0
  slow_rate: 0.0
