# 正确性配置：10 个请求同时到达，包含错误和超时，用来检查结果归属和通知次数。
name: faults
seed: 5
num_tasks: 10
batch_interval: 0.1

steps:
  min: 1
  max: 1

arrival:
  pattern: all_at_once

prompt:
  tokens_min: 50
  tokens_max: 200

output:
  median_tokens: 30
  sigma: 0.3

max_tokens: 128

model:
  base_ms: 20.0
  prefill_ms_per_token: 0.02
  decode_ms_per_token: 5.0
  jitter_sigma: 0.0

faults:
  error_rate: 0.2
  timeout_rate: 0.2
  slow_rate: 0.1
  slow_extra_ms: 1000.0
