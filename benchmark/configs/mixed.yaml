# 长短混合负载：200 个单步请求，泊松到达，输出长度有明显差异。
name: mixed
seed: 42
num_tasks: 200
batch_interval: 0.1
max_concurrency: 32

steps:
  min: 1
  max: 1

arrival:
  pattern: poisson
  rate_per_sec: 40.0

prompt:
  tokens_min: 50
  tokens_max: 1500

output:
  median_tokens: 80
  sigma: 1.0

max_tokens: 512

model:
  base_ms: 20.0
  prefill_ms_per_token: 0.02
  decode_ms_per_token: 5.0
  jitter_sigma: 0.15

faults:
  error_rate: 0.0
  timeout_rate: 0.0
  slow_rate: 0.01
  slow_extra_ms: 3000.0
