# 突发到达：每 300 毫秒来 50 个请求。
name: bursty_500
seed: 11
num_tasks: 500
batch_interval: 0.1
max_concurrency: 32

steps:
  min: 1
  max: 1

arrival:
  pattern: burst

burst:
  size: 50
  gap_ms: 300.0

prompt:
  tokens_min: 50
  tokens_max: 800

output:
  median_tokens: 60
  sigma: 0.8

max_tokens: 256

model:
  base_ms: 20.0
  prefill_ms_per_token: 0.02
  decode_ms_per_token: 5.0
  jitter_sigma: 0.1

faults:
  error_rate: 0.0
  timeout_rate: 0.0
  slow_rate: 0.0
